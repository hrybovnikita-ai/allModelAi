services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports: ["5050:5050"]
    volumes: ["allmodelai-data:/app/storage"]
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  allmodelai-data:
