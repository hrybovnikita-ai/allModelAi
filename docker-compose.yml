services:
  app:
    build: .
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DB_FILE: /app/backend/storage/database.sqlite
    ports: ["5050:5050"]
    volumes: ["allmodelai-data:/app/backend/storage"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5050/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
volumes:
  allmodelai-data:
