services:
  - type: web
    name: allmodelai
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    # Build context must be the monorepo root (not backend/) so workspace lockfiles resolve.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    disk:
      name: allmodelai-data
      mountPath: /app/backend/storage
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: DATABASE_URL
        sync: false
      - key: DB_FILE
        value: /app/backend/storage/database.sqlite
      - key: PUBLIC_URL
        value: https://all-model-ai.com
      - key: FRONTEND_ORIGIN
        value: https://all-model-ai.com,https://www.all-model-ai.com,https://all-model-ai.vercel.app
      - key: OPENAI_API_KEY
        sync: false
      - key: ALLMODELAI_OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: IMAGE_API_KEY
        sync: false
      - key: IMAGE_GENERATION_PROVIDER
        sync: false
      - key: IMAGE_PROVIDER
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_API_KEY
        sync: false
      - key: CLOUDFLARE_IMAGE_MODEL
        sync: false
      - key: IMAGE_ALLOW_FALLBACK
        sync: false
