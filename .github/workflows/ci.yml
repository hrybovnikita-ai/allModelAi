name: AllModelAI CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (no committed .env / live-looking keys)
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$' ; then
            echo "::error::Committed .env files are not allowed"
            exit 1
          fi
          if git grep -I -nE '(sk-[a-zA-Z0-9]{32,}|sk-proj-[a-zA-Z0-9_-]{32,}|AIza[0-9A-Za-z_-]{30,}|xai-[a-zA-Z0-9]{32,})' -- \
            ':!.env.example' ':!**/.env.example' ':!**/package-lock.json' ':!**/*.md' ; then
            echo "::error::Possible live API key pattern found in tracked files"
            exit 1
          fi
          echo "Secret scan passed"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install PyTorch CPU
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python dependencies
        run: python -m pip install -r ai_python/requirements-dev.txt

      - name: Install Node dependencies
        run: npm install

      - name: Validate env example (no secrets required)
        run: |
          test -f backend/.env.example
          ! grep -E '(sk-[a-zA-Z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|xai-[a-zA-Z0-9]{20,})' backend/.env.example
          echo "env example present; no live-looking secrets detected in example file"

      - name: Run backend critical tests
        run: npm run test:critical
        working-directory: backend
        env:
          PYTHON_BIN: python
          NODE_ENV: test
          ENABLE_PLUS_TEST_MODE: 'true'

      - name: Run backend full test suite
        run: npm test
        working-directory: backend
        env:
          PYTHON_BIN: python
          NODE_ENV: test
          ENABLE_PLUS_TEST_MODE: 'true'

      - name: Run Python router unit tests
        working-directory: ai_python
        run: python -m pytest tests/test_router.py tests/test_smart_fallback.py tests/test_router_model_fallback.py -q
        env:
          PYTHONPATH: .

      - name: Run frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Run frontend critical unit tests
        run: npm run test:critical
        working-directory: frontend

      - name: Run frontend full unit tests
        run: npm test
        working-directory: frontend
        env:
          CI: 'true'
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Playwright smoke (Chromium)
        id: playwright_smoke
        working-directory: frontend
        run: npm run test:e2e:smoke
        env:
          CI: 'true'

      - name: Write Playwright smoke summary
        if: always()
        run: |
          mkdir -p qa-reports
          node -e "
            const ok = process.env.PW_OUTCOME === 'success';
            const fs = require('fs');
            fs.writeFileSync('qa-reports/playwright-smoke.json', JSON.stringify({
              total: 4,
              passed: ok ? 4 : 0,
              failed: ok ? 0 : 1,
              skipped: 0,
              status: ok ? 'passed' : 'failed',
              failureLabels: ok ? [] : ['playwright-smoke']
            }));
          "
        env:
          PW_OUTCOME: ${{ steps.playwright_smoke.outcome }}

      - name: Dependency audit (report all; fail on critical)
        run: |
          mkdir -p qa-reports
          npm audit --workspaces 2>&1 | tee qa-reports/npm-audit.txt || true
          npm audit --audit-level=critical --workspaces

      - name: Record QA summary for developer dashboard
        if: always()
        run: npm run qa:record
        env:
          QA_BUILD_STATUS: ${{ job.status == 'success' && 'passed' || 'failed' }}

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts
          path: |
            qa-reports/
            backend/data/qa-last-run.json
            frontend/playwright-report/

      - name: Release readiness summary
        if: always()
        run: |
          echo "commit=${GITHUB_SHA}"
          echo "deployment=blocked_on_failing_ci_checks"
          echo "live_ai_eval=disabled"
          echo "payments=sandbox_and_unit_tests_only"
          echo "playwright_smoke=${{ steps.playwright_smoke.outcome }}"
