name: AllModelAI CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (no committed .env / live-looking keys)
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$' ; then
            echo "::error::Committed .env files are not allowed"
            exit 1
          fi
          # Scan tracked source only; ignore .env.example placeholders and lockfiles.
          if git grep -I -nE '(sk-[a-zA-Z0-9]{32,}|sk-proj-[a-zA-Z0-9_-]{32,}|AIza[0-9A-Za-z_-]{30,}|xai-[a-zA-Z0-9]{32,})' -- \
            ':!.env.example' ':!**/.env.example' ':!**/package-lock.json' ':!**/*.md' ; then
            echo "::error::Possible live API key pattern found in tracked files"
            exit 1
          fi
          echo "Secret scan passed"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install PyTorch CPU
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python dependencies
        # requirements-dev.txt includes -r requirements.txt plus pytest/httpx for router unit tests.
        run: python -m pip install -r ai_python/requirements-dev.txt

      - name: Install Node dependencies
        run: npm install

      - name: Validate env example (no secrets required)
        run: |
          test -f backend/.env.example
          ! grep -E '(sk-[a-zA-Z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|xai-[a-zA-Z0-9]{20,})' backend/.env.example
          echo "env example present; no live-looking secrets detected in example file"

      - name: Run backend tests
        run: npm test
        working-directory: backend
        env:
          PYTHON_BIN: python
          NODE_ENV: test
          ENABLE_PLUS_TEST_MODE: 'true'

      - name: Run Python router unit tests
        working-directory: ai_python
        run: python -m pytest tests/test_router.py tests/test_smart_fallback.py tests/test_router_model_fallback.py -q
        env:
          PYTHONPATH: .

      - name: Run frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Run frontend unit tests
        run: npm test
        working-directory: frontend
        continue-on-error: false

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Release readiness summary
        if: always()
        run: |
          echo "commit=${GITHUB_SHA}"
          echo "deployment=blocked_pending_owner_approval"
          echo "visual_baselines=not_auto_approved"
          echo "live_ai_eval=disabled"
          echo "payments=existing_providers_only"
